name: build-and-release

# Every commit to main: run the tests, build the installer, publish a GitHub Release with WinboardNews-Setup.exe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the release and its tag

concurrency:
  group: release
  cancel-in-progress: false   # never cancel a run that is halfway through publishing

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Native AOT needs the MSVC linker; the runner has Visual Studio, vswhere just has to be on PATH.
      - name: Put vswhere on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Test
        run: dotnet test tests/WinboardNews.Tests -c Release

      # 1) the background server (WinboardNews.exe) as a small native exe, no console window
      - name: Publish server
        run: dotnet publish src/WinboardNews -c Release -r win-x64 -p:Version=${{ env.VERSION }} -o artifacts/server

      # 2) the installer, with the server embedded; one file, asks only for UAC, shows nothing else
      - name: Publish installer
        shell: pwsh
        run: |
          dotnet publish src/WinboardNews.Setup -c Release -r win-x64 `
            -p:Version=${{ env.VERSION }} `
            "-p:ServerExe=$PWD\artifacts\server\WinboardNews.exe" `
            -o artifacts/setup
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item artifacts/setup/WinboardNews-Setup.exe artifacts/release/
          $hash = (Get-FileHash artifacts/release/WinboardNews-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinboardNews-Setup.exe" | Set-Content -Encoding ascii artifacts/release/WinboardNews-Setup.exe.sha256
          Get-ChildItem artifacts/release | Select-Object Name, Length

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ env.VERSION }}" `
            artifacts/release/WinboardNews-Setup.exe `
            artifacts/release/WinboardNews-Setup.exe.sha256 `
            --target "${{ github.sha }}" `
            --title "v${{ env.VERSION }}" `
            --generate-notes `
            --latest
