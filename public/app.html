<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>הגיזרה</title>
<style>
  :root { --bg:#f9f9f9; --fg:#1b1b1b; --dim:#6b6b6b; --line:#e3e3e3; --accent:#0f6cbd; --brk:#c42b1c; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#202020; --fg:#f3f3f3; --dim:#a0a0a0; --line:#333; --accent:#60cdff; --brk:#ff99a4; --card:#2b2b2b; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:14px/20px "Segoe UI Variable Text","Segoe UI",Arial,sans-serif; }
  header { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:16px; font-weight:600; flex:1; }
  #upd { color:var(--dim); font-size:12px; }
  button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  main { padding:0 14px 16px; }
  article { padding:10px 0; border-bottom:1px solid var(--line); }
  article a { color:inherit; text-decoration:none; display:block; }
  .meta { color:var(--dim); font-size:12px; display:flex; gap:8px; align-items:center; }
  .brk { color:var(--brk); font-weight:600; }
  .t { font-weight:600; margin-top:2px; }
  .b { margin-top:2px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .stale { color:var(--brk); }
  #empty { color:var(--dim); padding:24px 0; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>הגיזרה</h1>
  <span id="upd"></span>
  <button id="refresh" type="button" title="רענון">רענון</button>
</header>
<main id="list"><div id="empty">טוען...</div></main>

<script>
(function () {
  'use strict';
  var SITE = 'https://hagizra.news/';
  var list = document.getElementById('list');
  var upd = document.getElementById('upd');
  var timeFmt = new Intl.DateTimeFormat('he-IL', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jerusalem' });
  var dayFmt = new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'numeric', timeZone: 'Asia/Jerusalem' });
  var MEDIA = { image: 'תמונה', video: 'וידאו', audio: 'אודיו' };

  function diag(extra) {
    try {
      var d = {
        href: location.href, ua: navigator.userAgent, w: innerWidth, h: innerHeight, dpr: devicePixelRatio,
        webview: !!(window.chrome && window.chrome.webview), dark: matchMedia('(prefers-color-scheme: dark)').matches
      };
      for (var k in extra) d[k] = extra[k];
      navigator.sendBeacon ? navigator.sendBeacon('/diag', JSON.stringify(d))
        : fetch('/diag', { method: 'POST', body: JSON.stringify(d), keepalive: true });
    } catch (e) {}
  }
  window.addEventListener('error', function (e) { diag({ error: String(e.message), at: e.filename + ':' + e.lineno }); });
  window.addEventListener('unhandledrejection', function (e) { diag({ rejection: String(e.reason) }); });

  function when(ms) {
    var d = new Date(ms), today = new Date();
    var same = dayFmt.format(d) === dayFmt.format(today);
    return same ? timeFmt.format(d) : dayFmt.format(d) + ' ' + timeFmt.format(d);
  }

  function render(data) {
    list.textContent = '';
    if (!data.items.length) {
      var e = document.createElement('div'); e.id = 'empty'; e.textContent = 'אין חדשות להצגה כרגע'; list.appendChild(e);
    }
    data.items.forEach(function (it) {
      var art = document.createElement('article');
      var a = document.createElement('a'); a.href = SITE; a.target = '_blank'; a.rel = 'noopener';
      var meta = document.createElement('div'); meta.className = 'meta';
      var tm = document.createElement('span'); tm.textContent = when(it.time); meta.appendChild(tm);
      if (it.breaking) { var br = document.createElement('span'); br.className = 'brk'; br.textContent = 'מבזק'; meta.appendChild(br); }
      it.media.forEach(function (m) { var s = document.createElement('span'); s.textContent = MEDIA[m] || m; meta.appendChild(s); });
      a.appendChild(meta);
      if (it.title) { var t = document.createElement('div'); t.className = 't'; t.textContent = it.title; a.appendChild(t); }
      if (it.body) { var b = document.createElement('div'); b.className = 'b'; b.textContent = it.body; a.appendChild(b); }
      art.appendChild(a); list.appendChild(art);
    });
    upd.className = data.stale ? 'stale' : '';
    upd.textContent = (data.stale ? 'לא עדכני · ' : 'עודכן ') + (data.fetchedAt ? timeFmt.format(new Date(data.fetchedAt)) : '');
  }

  var busy = false;
  function load() {
    if (busy) return; busy = true;
    fetch('/news.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(render)
      .catch(function (e) { upd.className = 'stale'; upd.textContent = 'שגיאת טעינה'; diag({ loadError: String(e) }); })
      .then(function () { busy = false; });
  }

  document.getElementById('refresh').addEventListener('click', load);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  setInterval(function () { if (!document.hidden) load(); }, 60000);
  load();
  diag({ event: 'loaded' });
})();
</script>
</body>
</html>
